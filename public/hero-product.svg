<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t">
  <title id="t">Product dashboard tracking an MVP launch</title>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- app window -->
  <g filter="url(#sh)">
    <rect x="20" y="30" width="600" height="440" rx="18" fill="url(#win)" stroke="#333333"/>
  </g>
  <circle cx="46" cy="50" r="5" fill="#f87171"/><circle cx="64" cy="50" r="5" fill="#f5b921"/><circle cx="82" cy="50" r="5" fill="#34d399"/>
  <rect x="200" y="40" width="240" height="20" rx="10" fill="#222222"/>
  <text x="320" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#a3a3a3" text-anchor="middle">app.yourproduct.com</text>
  <path d="M20 70h600" stroke="#333333"/>

  <!-- sidebar -->
  <path d="M150 70v400" stroke="#333333"/>
  <path d="M52 86l12 7v14l-12 7-12-7V93Z" fill="#f5b921"/>
  <rect x="38" y="136" width="94" height="12" rx="6" fill="#f5b921" opacity=".85"/>
  <rect x="38" y="166" width="78" height="12" rx="6" fill="#333333"/>
  <rect x="38" y="196" width="86" height="12" rx="6" fill="#333333"/>
  <rect x="38" y="226" width="64" height="12" rx="6" fill="#333333"/>
  <rect x="38" y="256" width="80" height="12" rx="6" fill="#333333"/>

  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <text x="170" y="104" font-size="18" font-weight="700" fill="#fff">MVP Launch Board</text>
    <text x="170" y="124" font-size="12" fill="#a3a3a3">Discovery → Build → Shipped</text>

    <!-- stat cards -->
    <rect x="170" y="140" width="130" height="64" rx="12" fill="#222222"/>
    <text x="184" y="162" font-size="11" fill="#a3a3a3">Sprint</text>
    <text x="184" y="190" font-size="20" font-weight="700" fill="#fff">4 of 6</text>
    <rect x="315" y="140" width="130" height="64" rx="12" fill="#222222"/>
    <text x="329" y="162" font-size="11" fill="#a3a3a3">Next demo</text>
    <text x="329" y="190" font-size="20" font-weight="700" fill="#fff">Friday</text>
    <rect x="460" y="140" width="140" height="64" rx="12" fill="#222222"/>
    <text x="474" y="162" font-size="11" fill="#a3a3a3">Status</text>
    <circle cx="480" cy="184" r="5" fill="#34d399"/>
    <text x="492" y="190" font-size="20" font-weight="700" fill="#fff">On track</text>

    <!-- kanban -->
    <text x="170" y="240" font-size="12" font-weight="600" fill="#d4d4d4">Discovery</text>
    <text x="315" y="240" font-size="12" font-weight="600" fill="#d4d4d4">Build</text>
    <text x="460" y="240" font-size="12" font-weight="600" fill="#d4d4d4">Shipped</text>

    <g font-size="12" fill="#fff">
      <rect x="170" y="252" width="130" height="46" rx="10" fill="#222222"/>
      <text x="182" y="272">Admin roles</text><rect x="182" y="282" width="60" height="5" rx="2.5" fill="#333333"/>
      <rect x="170" y="306" width="130" height="46" rx="10" fill="#222222"/>
      <text x="182" y="326">Analytics</text><rect x="182" y="336" width="80" height="5" rx="2.5" fill="#333333"/>

      <rect x="315" y="252" width="130" height="46" rx="10" fill="#222222" stroke="#f5b921"/>
      <text x="327" y="272">Payments</text>
      <rect x="327" y="282" width="106" height="5" rx="2.5" fill="#333333"/><rect x="327" y="282" width="72" height="5" rx="2.5" fill="#f5b921"/>
      <rect x="315" y="306" width="130" height="46" rx="10" fill="#222222"/>
      <text x="327" y="326">Notifications</text>
      <rect x="327" y="336" width="106" height="5" rx="2.5" fill="#333333"/><rect x="327" y="336" width="40" height="5" rx="2.5" fill="#f5b921"/>
      <rect x="315" y="360" width="130" height="46" rx="10" fill="#222222"/>
      <text x="327" y="380">Onboarding</text>
      <rect x="327" y="390" width="106" height="5" rx="2.5" fill="#333333"/><rect x="327" y="390" width="90" height="5" rx="2.5" fill="#f5b921"/>

      <rect x="460" y="252" width="140" height="46" rx="10" fill="#222222"/>
      <text x="472" y="280">Sign-in</text><path d="M578 270l4 4 8-8" stroke="#34d399" stroke-width="2" fill="none"/>
      <rect x="460" y="306" width="140" height="46" rx="10" fill="#222222"/>
      <text x="472" y="334">Dashboard</text><path d="M578 324l4 4 8-8" stroke="#34d399" stroke-width="2" fill="none"/>
      <rect x="460" y="360" width="140" height="46" rx="10" fill="#222222"/>
      <text x="472" y="388">Public API</text><path d="M578 378l4 4 8-8" stroke="#34d399" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- floating: weekly demo sparkline -->
  <g filter="url(#sh)">
    <rect x="490" y="2" width="146" height="72" rx="14" fill="#222222" stroke="#333333"/>
  </g>
  <text x="504" y="24" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#a3a3a3">Features shipped</text>
  <path d="M504 60l18-8 18 4 18-14 18 2 18-16 18-6" fill="none" stroke="#f5b921" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating: release toast -->
  <g filter="url(#sh)">
    <rect x="4" y="412" width="250" height="66" rx="16" fill="#f5b921"/>
  </g>
  <circle cx="38" cy="445" r="16" fill="#0a0a0a"/>
  <path d="M31 445l5 5 9-9" stroke="#f5b921" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" fill="#0a0a0a">
    <text x="64" y="441" font-size="15" font-weight="700">Release v1.0 is live</text>
    <text x="64" y="460" font-size="12">Deployed to production</text>
  </g>
</svg>
